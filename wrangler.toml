name = "armando-al-pantheon"
main = "src/index.js"
compatibility_date = "2026-10-13"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "BOOKING_COORDINATOR"
class_name = "BookingCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BookingCoordinator"]
